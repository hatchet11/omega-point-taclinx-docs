# Agent loop: MENTION -> ANSWER. Comment "@claude ..." on an issue or PR.
name: agent-mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  # claude-code-action mints its GitHub App token via OIDC.
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  respond:
    # Only maintainers can spend tokens. Without this, any drive-by commenter
    # can trigger a paid run.
    if: |
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1.0.186
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow's own token rather than the Claude GitHub App.
          # The app's token exchange 401s here; the permissions block above
          # already grants what the action needs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            Answer the @claude mention in this thread.

            If it is a question, answer it from the code — cite file:line for
            anything you assert about how this repository actually behaves. If
            you did not read it, say so instead of stating it as fact.

            If it asks for a change, make it on a branch and open a pull
            request. Run the repository's test suite first if one exists.

            Never push to the default branch. Never run wrangler deploy,
            netlify deploy, any `deploy:*` script, or a remote database
            migration. Never echo a secret, credential, or a real person's
            personal data into a comment.
